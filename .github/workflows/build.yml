name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Build APK
        run: flet build apk --project "Tasbih" --org "com.tasbih.app"
      - uses: actions/upload-artifact@v4
        with:
          name: tasbih-apk
          path: build/apk/app-release.apk